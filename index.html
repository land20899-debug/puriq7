<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andrei Chikatilo — Animated History</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <canvas id="scene" width="1280" height="720"></canvas>

      <div class="hud">
        <div class="label">HISTORY • DOCUMENTARY STYLE</div>
        <h1 id="title">Andrei Chikatilo</h1>
        <p id="narration">
          A short animated account of the Soviet serial killer and the history surrounding his crimes.
        </p>
        <div class="controls">
          <button id="toggle">Play</button>
          <button id="restart" class="secondary">Restart</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
